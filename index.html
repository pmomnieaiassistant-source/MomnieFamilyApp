<!DOCTYPE html>
<html lang="en">
<head>

<title>Momnie Family</title>
<script src="config.js"></script>
<style>
  /* Day: light background, deep blue. Night (phone in Dark Mode): dark navy, very light blue. */
  :root { --bg:#eef2f7; --card:#fff; --text:#0f172a; --muted:#475569; --line:#dfe5ee; --soft:#eef2f8; --accent:#1e40af; --onacc:#fff; --accsoft:#dde6fb; --asst:#6b3fc4; --asstbg:#f3eefe;
          --green:#0f6b3e; --red:#b4233a; --amber:#7a4b00; --redbg:#ffe8ec; --amberbg:#fdecc8; --greenbg:#dcf3e6; --grad:var(--accent); --blur:rgba(238,242,247,.86);
          --shadow:0 1px 2px rgba(15,23,42,.05), 0 6px 18px rgba(15,23,42,.07); --shadow-sm:0 1px 3px rgba(15,23,42,.12); color-scheme:light dark; }
  @media (prefers-color-scheme: dark) { :root { --asst:#c9b6ff; --asstbg:#221a3d; --bg:#0b1220; --card:#151e30; --text:#f1f5f9; --muted:#a3b3ca; --line:#24314b; --soft:#1d2840; --accent:#bfdbfe; --onacc:#0b1220; --accsoft:#1f3052;
          --green:#86e3b7; --red:#ff9aab; --amber:#f5c66b; --redbg:#3d1219; --amberbg:#3a2a07; --greenbg:#0f3326; --blur:rgba(11,18,32,.86);
          --shadow:0 8px 22px rgba(0,0,0,.35); --shadow-sm:0 1px 3px rgba(0,0,0,.4); } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font:16px -apple-system,"SF Pro Text","Inter",system-ui,sans-serif; background:var(--bg); color:var(--text);
         -webkit-font-smoothing:antialiased; }
  /* The page itself never scrolls; only the content area (#view) does. iPhone home-screen apps misplace the fixed
     bottom tabs and + button when the page scrolls under them while it redraws. Use 100vh there, not 100%
     (100% can come up short by the status bar and lift the tabs). In a plain Safari tab, use the visible height. */
  html, body { height:100vh; overflow:hidden; }
  @media not all and (display-mode: standalone) { html, body { height:100dvh; } }
  body { display:flex; flex-direction:column; }
  header { flex:none; }
  #view { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain; padding-bottom:calc(84px + env(safe-area-inset-bottom)); }
  #view > * { flex-shrink:0; }
  header { position:sticky; top:0; z-index:5; display:flex; justify-content:space-between; align-items:center; padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
           background:var(--blur); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); border-bottom:.5px solid var(--line); }
  h1 { font-size:26px; margin:0; font-weight:800; letter-spacing:-.6px; }
  h2 { margin:0 0 4px; font-weight:800; font-size:20px; letter-spacing:-.4px; }
  h3 { margin:18px 0 6px; font-size:15px; font-weight:800; }
  a { color:var(--accent); text-decoration:none; font-weight:600; }
  .icon-btn { background:none; border:0; font-size:21px; color:var(--text); width:40px; height:40px; border-radius:50%; padding:0; }
  .muted { color:var(--muted); } .small { font-size:13px; } .b { font-weight:700; } .red { color:var(--red); font-weight:700; } .grn { color:var(--green); font-weight:700; }
  .pad { padding:0 16px; } .row { display:flex; justify-content:space-between; gap:10px; align-items:center; } .grow { flex:1; min-width:0; }
  .seg { display:flex; border-bottom:.5px solid var(--line); }
  .seg button { flex:1; padding:12px 6px; border:0; background:none; font:inherit; font-size:15px; font-weight:600; color:var(--muted); position:relative; }
  .seg button.on { color:var(--text); }
  .seg button.on::after { content:''; position:absolute; left:25%; right:25%; bottom:-1px; height:2px; border-radius:2px; background:var(--grad); }
  .chips { display:flex; gap:8px; padding:10px 16px 4px; overflow-x:auto; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { display:inline-block; border:0; font:inherit; font-size:13px; padding:5px 12px; border-radius:999px; background:var(--soft); color:var(--text); font-weight:600; white-space:nowrap; }
  .chip.on { background:var(--text); color:var(--bg); } .chip.ok { background:var(--greenbg); color:var(--green); } .chip.bad { background:var(--redbg); color:var(--red); }
  .card { padding:14px 16px; border-bottom:.5px solid var(--line); }
  .btn { flex:1; padding:10px 14px; border:0; border-radius:999px; font:inherit; font-size:15px; font-weight:700; background:var(--grad); color:#fff; text-align:center; display:inline-block; }
  .btn.dark { background:var(--text); color:var(--bg); } .btn.gray { background:var(--soft); color:var(--text); flex:0 0 auto; } .btn.sm { padding:7px 12px; font-size:13px; flex:0 0 auto; }
  .btn.danger { background:var(--redbg); color:var(--red); flex:0 0 auto; }
  .btn:active { transform:scale(.97); } .btn:disabled { opacity:.45; }
  .actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .empty { text-align:center; color:var(--muted); padding:36px 24px; font-size:15px; }
  .fab { position:fixed; right:18px; bottom:calc(76px + env(safe-area-inset-bottom)); width:56px; height:56px; border-radius:50%; border:0; background:var(--grad); color:#fff; font-size:28px;
         box-shadow:0 8px 24px rgba(37,99,235,.35); z-index:4; }
  nav.bottom { position:fixed; left:0; right:0; bottom:0; display:flex; z-index:5; background:var(--blur); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
               border-top:.5px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  nav.bottom button { flex:1; border:0; background:none; padding:9px 0 7px; color:var(--muted); font-family:inherit; }
  nav.bottom button span { display:block; font-size:11px; font-weight:600; margin-top:2px; }
  nav.bottom button.on { color:var(--accent); }
  .av { flex:0 0 auto; width:36px; height:36px; border-radius:50%; padding:2px; background:var(--grad); display:inline-flex; }
  .av i { flex:1; border-radius:50%; background:var(--soft); border:2px solid var(--card); display:flex; align-items:center; justify-content:center; font-style:normal; font-weight:800; font-size:13px; }
  .av i[data-p="Paul"] { background:#dbe7ff; color:#1e3a8a; } .av i[data-p="Shana"] { background:#e2e8f0; color:#334155; } .av i[data-p="App"] { background:#eef2f7; color:#475569; }
  /* today */
  .hero { margin:12px; padding:14px 14px 10px; border-radius:20px; border:2px solid transparent; background:linear-gradient(var(--card),var(--card)) padding-box, var(--grad) border-box; }
  .lbl { font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-top:12px; }
  .alert { margin-top:6px; border-radius:12px; padding:8px 10px; font-size:14px; background:var(--soft); }
  .alert.red { background:var(--redbg); color:var(--red); font-weight:600; } .alert.amber { background:var(--amberbg); color:var(--amber); font-weight:600; }
  .tiles { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:10px; }
  .tile { background:var(--soft); border-radius:12px; padding:10px; } .tile .tv { font-weight:700; font-size:15px; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; }
  /* planner cards */
  .pc { display:flex; gap:10px; align-items:center; margin:6px 0; padding:8px 10px; border-radius:12px; border-left:4px solid var(--c); background:color-mix(in srgb, var(--c) 12%, var(--bg)); }
  .pc .t { width:62px; flex:0 0 auto; font-size:13px; font-weight:700; color:var(--muted); } .pc img { width:26px; height:26px; border-radius:50%; background:#fff; }
  .pc .ti { font-weight:700; font-size:15px; } .allday .pc { margin:4px 0; padding:6px 10px; }
  .dayhead { display:flex; justify-content:space-between; align-items:center; padding:14px 16px 2px; } .dayhead.today b { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .weekbar { display:flex; align-items:center; justify-content:space-between; margin:6px 8px; } .weekbar span { font-weight:700; }
  /* feed */
  .post { display:flex; gap:12px; padding:12px 16px; border-bottom:.5px solid var(--line); } .pbody { flex:1; min-width:0; font-size:15px; line-height:1.35; }
  .ptext { margin-top:6px; padding:10px 12px; border-radius:14px; background:var(--soft); font-weight:600; white-space:pre-wrap; word-break:break-word; }
  .msg { background:linear-gradient(var(--soft),var(--soft)) padding-box, var(--grad) border-box; border:1.5px solid transparent; }
  .sect { font-size:15px; font-weight:800; padding:16px 16px 4px; }
  /* to-do, lists */
  .check { flex:0 0 auto; width:26px; height:26px; border-radius:50%; border:2px solid var(--muted); background:none; color:#fff; font-size:14px; font-weight:800; padding:0; }
  .check.on { border:0; background:var(--grad); } .check.sq { border-radius:7px; }
  .done .ti, .done .payee { text-decoration:line-through; color:var(--muted); }
  .li { display:flex; gap:12px; align-items:center; padding:12px 16px; border-bottom:.5px solid var(--line); } .li .ti { font-weight:700; } .chev { color:var(--muted); font-size:20px; }
  .dcard { transition:transform .15s; }
  /* recipes feed (Meals > Recipes) */
  .rcard { position:relative; overflow:hidden; margin:0 12px 12px; border:1px solid var(--line); border-radius:20px; background:var(--card); box-shadow:var(--shadow); }
  .rcard .rrow { display:flex; gap:12px; align-items:center; padding:12px 14px; }
  .rcard .rcover { display:block; width:100%; height:170px; object-fit:cover; background:var(--soft); }
  .rcard.dim .rcover { opacity:.55; }
  .rcard .rnights { position:relative; z-index:1; background:var(--card); border-top:1px solid var(--line); }
  .rcard > .rin { display:block; background:var(--card); transition:transform .15s; position:relative; z-index:1; }
  .rcard .under { position:absolute; inset:0; display:flex; justify-content:space-between; align-items:center; padding:0 20px; background:var(--soft); font-weight:700; font-size:14px; }
  .rcard .under .yes { color:var(--green); } .rcard .under .no { color:var(--muted); }
  .rcard .dchg { z-index:3; border-radius:20px; }
  .imptext { width:100%; min-height:180px; margin-top:10px; font-family:ui-monospace, Menlo, monospace; font-size:13px; }
  .llmtxt { white-space:pre-wrap; font-size:12px; line-height:1.45; background:var(--soft); border-radius:12px; padding:12px; max-height:50vh; overflow:auto; }
  .rcard.dim .ti, .rcard.dim .small { opacity:.5; }
  .rcard .ti { font-weight:700; font-size:16px; }
  .nights { display:flex; gap:8px; overflow-x:auto; padding:6px 16px 12px; scrollbar-width:none; -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain; touch-action:pan-x; scroll-snap-type:x proximity; } .nights::-webkit-scrollbar { display:none; }
  .nhint { padding:10px 16px 0; }
  .night { flex:0 0 auto; border:0; font:inherit; border-radius:12px; background:var(--soft); color:var(--text); padding:8px 10px; text-align:left; min-width:96px; scroll-snap-align:start; } .night:active { transform:scale(.97); }
  .night.free { background:color-mix(in srgb, var(--green) 10%, var(--card)); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--green) 30%, transparent); }
  .night b { display:block; font-size:13px; } .night span { display:block; font-size:12px; color:var(--muted); max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .night.cur { outline:2px solid var(--accent); }
  .wklbl { flex:0 0 auto; align-self:center; font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .rstars { color:var(--accent); letter-spacing:1px; }
  /* sheets */
  dialog { border:0; margin:auto 0 0; width:100%; max-width:100%; max-height:90vh; overflow:auto; padding:22px 18px calc(22px + env(safe-area-inset-bottom)); border-radius:22px 22px 0 0; background:var(--card); color:var(--text); }
  dialog[open] { animation:up .2s ease-out; } @keyframes up { from { transform:translateY(40px); opacity:.4; } to { transform:none; opacity:1; } }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  /* A form's Save buttons stay pinned to the bottom of the sheet, so they're never off screen. */
  dialog .actions.formbar { position:sticky; bottom:calc(-22px - env(safe-area-inset-bottom)); z-index:2; margin:12px -18px calc(-22px - env(safe-area-inset-bottom)); padding:10px 18px calc(12px + env(safe-area-inset-bottom)); background:var(--card); border-top:1px solid var(--line); }
  dialog.splash { margin:auto; width:calc(100% - 40px); max-width:400px; border-radius:22px; text-align:center; }
  dialog.splash img { max-width:100%; border-radius:14px; margin:10px 0; } dialog.splash .q { font-size:20px; font-weight:700; line-height:1.35; font-family:Georgia,serif; font-style:italic; }
  .x { position:sticky; float:right; top:0; border:0; background:var(--soft); color:var(--text); width:32px; height:32px; border-radius:50%; font-size:15px; z-index:2; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 5px; font-weight:600; }
  input, select, textarea { width:100%; padding:12px 13px; font:inherit; font-size:16px; border:0; border-radius:12px; background:var(--soft); color:var(--text); -webkit-appearance:none; appearance:none; }
  textarea { min-height:84px; resize:vertical; } input:focus, select:focus, textarea:focus { outline:2px solid var(--accent); }
  input[type=checkbox], input[type=radio] { width:22px; height:22px; -webkit-appearance:auto; appearance:auto; flex:0 0 auto; padding:0; margin:0; border:0; background:none; }
  .check-row { display:flex; align-items:center; gap:10px; margin-top:14px; font-weight:600; color:var(--text); font-size:15px; }
  .two { display:flex; gap:10px; } .two > div { flex:1; min-width:0; }
  .kv { font-size:15px; margin-top:6px; line-height:1.4; word-break:break-word; white-space:pre-wrap; } .kv span { color:var(--muted); font-size:13px; font-weight:600; display:block; }
  .err { color:var(--red); font-size:14px; margin-top:8px; min-height:18px; font-weight:600; }
  .cm { padding:8px 0; border-top:.5px solid var(--line); font-size:15px; } .cm.sys { color:var(--muted); font-style:italic; font-size:13px; }
  .rx { border:0; background:var(--soft); border-radius:999px; padding:6px 12px; font:inherit; font-size:14px; font-weight:600; color:var(--text); } .rx.on { outline:2px solid var(--accent); }
  .stars button { border:0; background:none; font-size:24px; padding:0 2px; color:var(--accent); }
  #toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(150px + env(safe-area-inset-bottom)); background:var(--text); color:var(--bg); padding:11px 18px; border-radius:999px; display:none;
           font-size:14px; font-weight:600; z-index:99; max-width:90%; text-align:center; }
  #ptr { position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 64px); width:38px; height:38px; margin-left:-19px; border-radius:50%; background:var(--card); box-shadow:0 2px 12px rgba(0,0,0,.18);
         display:flex; align-items:center; justify-content:center; z-index:4; opacity:0; transform:translateY(-50px); pointer-events:none; font-size:20px; font-weight:700; color:var(--accent); }
  #ptr.spin span { animation:spin .8s linear infinite; } @keyframes spin { to { transform:rotate(360deg); } }
  .emo { filter:saturate(.4) contrast(.95); opacity:.85; }
  /* v5: muted person colors, status boxes, swipe-to-delete */
  .pdot { width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:1px; flex:0 0 auto; }
  .who { display:inline-flex; gap:3px; flex:0 0 auto; } .who i { width:22px; height:22px; border-radius:50%; font-style:normal; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center;
         color:var(--pc); background:color-mix(in srgb, var(--pc) 16%, var(--bg)); }
  .box { margin:12px; border:1px solid var(--line); border-radius:18px; overflow:hidden; background:var(--card); }
  .box > .boxh { padding:12px 16px 4px; font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .box .li:last-child { border-bottom:0; }
  .strow { display:flex; gap:8px; align-items:baseline; padding:3px 0; font-size:14px; line-height:1.4; } .strow b { flex:0 0 74px; font-weight:700; white-space:nowrap; }
  .swipe { position:relative; overflow:hidden; } .swipe > .post { background:var(--bg); transition:transform .15s; position:relative; z-index:1; }
  .swipe .under { position:absolute; inset:0; display:flex; justify-content:flex-end; align-items:center; padding-right:22px; background:var(--redbg); color:var(--red); font-weight:700; font-size:14px; }
  .irow { display:flex; gap:6px; margin-top:6px; align-items:center; } .irow input, .irow select { padding:10px; font-size:15px; } .irow .n { flex:1 1 auto; min-width:0; } .irow .a { flex:0 0 64px; } .irow .u { flex:0 0 80px; }
  .irow .rm, .fchip .rm { flex:0 0 auto; border:0; background:var(--soft); color:var(--muted); width:32px; height:32px; border-radius:50%; font-size:14px; }
  .qty { color:var(--muted); font-weight:600; font-style:normal; display:inline; }
  .ic { display:inline-block; vertical-align:-4px; flex:0 0 auto; }
  .btn .ic { width:16px; height:16px; vertical-align:-3px; margin-right:4px; }
  .hicon { --hc:var(--accent); width:38px; height:38px; border-radius:11px; background:color-mix(in srgb, var(--hc) 13%, var(--bg)); color:var(--hc); display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  #sync { position:fixed; top:calc(env(safe-area-inset-top) + 2px); left:50%; transform:translateX(-50%); font-size:11px; font-weight:700; color:var(--muted); z-index:6; display:none; letter-spacing:.3px; }
  #sync.on { display:block; }
  /* ---- v6: card look ---- */
  header { border-bottom:0; }
  .btn { background:var(--accent); color:var(--onacc); } .btn.gray { background:var(--soft); color:var(--text); } .btn.dark { background:var(--text); color:var(--bg); }
  .btn .ic, .chip .ic, .alert .ic { vertical-align:-3px; }
  /* Stacked posts: several posts shown as one pile of cards. The front card is a normal post; the next two peek out
     underneath; cards already seen have slid off to the left. Swipe (or the arrows) to shuffle through. */
  .stk { position:relative; margin:0 12px 12px; isolation:isolate; }   /* its card layers stay inside it, so menus and sheets always draw on top */
  .stkdeck { display:grid; padding-bottom:16px; touch-action:pan-y; outline:none; align-items:start; height:var(--dh, auto); transition:height .28s ease; }   /* the deck is as tall as the card in front (set by stackFit) */
  .stkdeck:focus-visible .sc[data-d="0"] .scin { box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
  .stk.stkdrag .stkdeck { user-select:none; -webkit-user-select:none; }
  .stkdeck img { -webkit-user-drag:none; }
  .sc { grid-area:1 / 1; display:flex; min-width:0; height:var(--dh, auto); transform-origin:50% 100%; transition:transform .32s cubic-bezier(.2,.8,.25,1), opacity .26s ease; }
  .scin { flex:1; min-width:0; border:1px solid var(--line); border-radius:var(--r-card, 20px); background:var(--card); box-shadow:var(--shadow); overflow:hidden; }
  .scin > .post { background:var(--card); border-bottom:0; padding:14px; box-sizing:border-box; transition:opacity .2s ease; }
  .scin > .post.asst { background:var(--asstbg); }
  .sc[data-d="0"] { z-index:10; height:auto; }
  .sc[data-d="1"] { z-index:9; transform:translateY(8px) scale(.955); }
  .sc[data-d="2"] { z-index:8; transform:translateY(16px) scale(.91); }
  .sc[data-d="3"] { z-index:7; transform:translateY(16px) scale(.91); opacity:0; }
  .sc[data-d="-1"] { z-index:12; transform:translateX(-118%) rotate(-9deg); opacity:0; }
  .sc:not([data-d="0"]) { pointer-events:none; }
  .sc[data-d="1"] .scin, .sc[data-d="2"] .scin { box-shadow:0 1px 3px rgba(15,23,42,.10); }
  .sc[data-d="1"] .scin > *, .sc[data-d="2"] .scin > *, .sc[data-d="3"] .scin > * { opacity:0; }   /* only the front card's content shows */
  .stkcount { position:absolute; top:10px; right:10px; z-index:20; padding:3px 9px; border-radius:999px; background:color-mix(in srgb, var(--card) 88%, transparent);
              border:1px solid var(--line); color:var(--muted); font-size:12px; font-weight:800; letter-spacing:.2px; pointer-events:none; font-variant-numeric:tabular-nums; }
  .stkfoot { display:flex; align-items:center; gap:6px; padding:2px 2px 0; margin-top:18px; }   /* clear of the cards peeking out below */
  .stkfoot button { border:0; background:none; color:var(--muted); font:inherit; font-size:13px; font-weight:700; padding:6px 8px; border-radius:10px; display:flex; align-items:center; }
  .stkfoot button:disabled { opacity:.35; }

// A Home Screen app can sit in the background for days without reloading. So: check for a new version whenever the app
