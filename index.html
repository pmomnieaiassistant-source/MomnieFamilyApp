<style>
  /* Day: light background, deep blue. Night (phone in Dark Mode): dark navy, very light blue. */
  :root { --bg:#eef2f7; --card:#fff; --text:#0f172a; --muted:#475569; --line:#dfe5ee; --soft:#eef2f8; --accent:#1e40af; --onacc:#fff; --accsoft:#dde6fb;

               border-top:.5px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }

  /* today */

  dialog.splash img { max-width:100%; border-radius:14px; margin:10px 0; } dialog.splash .q { font-size:20px; font-weight:700; line-height:1.35; font-family:Georgia,serif; font-style:italic; }

  .err { color:var(--red); font-size:14px; margin-top:8px; min-height:18px; font-weight:600; }
  .cm { padding:8px 0; border-top:.5px solid var(--line); font-size:15px; } .cm.sys { color:var(--muted); font-style:italic; font-size:13px; }

  /* v5: muted person colors, status boxes, swipe-to-delete */

  .who { display:inline-flex; gap:3px; flex:0 0 auto; } .who i { width:22px; height:22px; border-radius:50%; font-style:normal; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center;
         color:var(--pc); background:color-mix(in srgb, var(--pc) 16%, var(--bg)); }
  .box { margin:12px; border:1px solid var(--line); border-radius:18px; overflow:hidden; background:var(--card); }

<body>

<script>
// Momnie Family app v6.0
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], DAYN = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'], ADULTS = ['Paul', 'Shana'];
// Shown at the bottom of Home. Bump it together with VERSION in sw.js on every release.
const APP_VERSION = '8.6 · Nov 17, 2026';
const TABLES = ['People', 'Schools', 'SchoolCal', 'Activities', 'Overrides', 'Events', 'Caretakers', 'Childcare', 'Birthdays', 'Todos', 'TodoTypes', 'Recipes', 'DinnerRules', 'Weeks', 'Menus',
  'Groceries', 'GroceryList', 'HouseCards', 'Houses', 'WeatherRules', 'Quotes', 'Memories', 'Updates', 'Messages', 'Activity', 'Comments', 'Reactions', 'Links', 'Settings', 'Photos', 'gifts', 'daily_items', 'daily_completions'];
const CAT = { Kids: '#4f7cc2', Work: '#64748b', Family: '#5b6fa8', Dinner: '#b08a4f', Caretaker: '#3e9aa6', Shared: '#94a3b8', Birthday: '#c9806a' }, SCHOOL_C = ['#5a72b8', '#7a8597', '#4a6fb0'];
// Muted person colors (Outlook-style): Clara pink, Conrad green, Charlie blue, Shana purple, Paul grey.
const PCOL = { Clara: '#c8578f', Conrad: '#3d9a62', Charlie: '#3a7fd5', Shana: '#8b62c7', Paul: '#6b7280' }, PCOL_X = ['#b07a3c', '#3e9aa6', '#a65f5f'];
const pcol = n => PCOL[n] || PCOL[String(n || '').split(' ')[0]] || PCOL_X[(String(n || '').length) % 3];
// App-made text (older weekly cards) can carry emoji; drop them so posts stay plain.
const stripEmo = s => String(s || '').replace(/(\p{Extended_Pictographic}(️|‍\p{Extended_Pictographic})*)\s*/gu, '');
const noEmo = s => String(s || '').replace(/(\p{Extended_Pictographic}(️|‍\p{Extended_Pictographic})*)\s*/gu, '').trim();
const NCATS = { planning: 'Planning gaps (rides, caretakers)', bills: 'Bills and to-dos', convo: 'Messages, comments and questions', planner: 'Planner changes', dinner: 'Meals and groceries', upkeep: 'House upkeep', summary: 'Morning summary and weekly cards' };
const $ = id => document.getElementById(id);
const store = { get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const S = {}; TABLES.forEach(t => S[t] = []);
let CAL = [], WX = null, ME = '', view = 'feed', TODAY = '', SEEN = {};

// Backend (Apps Script web app) URL. Set once here so nobody has to type it.
const API_URL = 'https://script.google.com/macros/s/AKfycbzMv2Qje7i1dCWJcV6phZTGX_uzjeY3f9ZNtnvxdopkypJdpE2hVhQl_3S-4ln9lyy2lw/exec';
const apiUrl = () => API_URL || store.get('url');
// Each person opens the app from their own link: .../?u=<key>. The key is that person's passcode in Apps Script
// (PASSCODE_PAUL / PASSCODE_SHANA). It is saved on the phone, so there is no code to type.
// The key stays in the address so "Add to Home Screen" keeps it.
let PIN = '';
(function () {
  try { ['pass', 'tries', 'lockUntil'].forEach(k => localStorage.removeItem(k)); } catch (e) {}
  const q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.slice(1)), u = q.get('u') || h.get('u');
  if (u) { if (u !== store.get('tok')) { store.set('tok', u); store.set('cache', ''); } }
  if (h.get('url')) { store.set('url', h.get('url')); history.replaceState(null, '', location.pathname + location.search); }
  PIN = store.get('tok');
})();

// ---------- helpers ----------
const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const list = s => String(s || '').split(',').map(x => x.trim()).filter(Boolean);
const isUrl = s => /^https?:\/\//i.test(String(s || '').trim());
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const addMonths = (s, n) => { const d = parse(s); d.setMonth(d.getMonth() + n); return ymd(d); };
const dowIdx = s => (parse(s).getDay() + 6) % 7;
const mondayOf = s => addDays(s, -dowIdx(s));
const fmtDate = s => s ? parse(s.slice(0, 10)).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
const fmtDay = s => s ? parse(s.slice(0, 10)).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : '';
const fmtLong = s => parse(s).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
const fmtT = s => { if (!s) return ''; const [h, m] = s.split(':').map(Number); return ((h + 11) % 12 + 1) + (m ? ':' + pad(m) : '') + (h < 12 ? ' AM' : ' PM'); };
// Times are picked in 15-minute steps. A value already saved off the grid (e.g. 8:10) stays selectable.
const hm = n => pad(Math.floor(n / 60) % 24) + ':' + pad(n % 60), toMin = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + (m || 0); };
const TIMES = Array.from({ length: 96 }, (_, i) => hm(((i + 24) % 96) * 15));   // 6 AM first, overnight times at the end
const TIMES5 = Array.from({ length: 288 }, (_, i) => hm(((i + 72) % 288) * 5));   // 5-minute steps for school times
const timeSelect = (attrs, val, blank, step) => { const ts = step === 5 ? TIMES5 : TIMES; return `<select ${attrs}><option value="">${esc(blank || 'Pick a time')}</option>${(val && !ts.includes(val) ? [val] : []).concat(ts).map(t => `<option value="${t}" ${t === val ? 'selected' : ''}>${fmtT(t)}</option>`).join('')}</select>`; };
/** Length between two times, e.g. "3.5 hours" or "45 min" (past midnight counts as the next day). */
const durTxt = (a, b) => { if (!a || !b) return ''; let m = toMin(b) - toMin(a); if (m <= 0) m += 1440; return m < 60 ? m + ' min' : `${+(m / 60).toFixed(2)} hour${m === 60 ? '' : 's'}`; };
const fmtT2 = s => { const [h, m] = s.split(':').map(Number); return ((h + 11) % 12 + 1) + ':' + pad(m) + (h < 12 ? ' AM' : ' PM'); };
const nowHM = () => { const n = new Date(); return pad(n.getHours()) + ':' + pad(n.getMinutes()); };
const money = n => Number(n || 0).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
const nid = () => Math.random().toString(16).slice(2, 10).padEnd(8, '0');
const norm = s => String(s || '').toLowerCase().replace(/\(.*?\)/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim().replace(/(es|s)$/, '');
const byId = (t, id) => S[t].find(r => r.id === String(id));
const kids = () => S.People.filter(p => p.kind === 'kid');
const joinNames = a => a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
const kidNames = a => { const k = kids().map(p => p.name); return a.length >= 3 && k.every(n => a.includes(n)) ? 'the kids' : joinNames(a); };
function ago(t) { const d = new Date(t), m = Math.round((Date.now() - d) / 60000); if (isNaN(m)) return ''; if (m < 1) return 'now'; if (m < 60) return m + 'm'; if (m < 1440) return Math.floor(m / 60) + 'h'; if (m < 10080) return Math.floor(m / 1440) + 'd'; return fmtDate(t); }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 2600); }
// Presence: green ring if someone used the app in the last 5 minutes, yellow from 5 to 30 minutes, then nothing.
const seenMin = who => who === ME ? 0 : SEEN[who] ? (Date.now() - new Date(SEEN[who])) / 60000 : Infinity;
const seenCls = who => !ADULTS.includes(who) ? '' : seenMin(who) < 5 ? 'live' : seenMin(who) < 30 ? 'idle' : '';
const seenTxt = who => { if (who === ME || !SEEN[who]) return ''; const m = Math.floor(seenMin(who)), h = Math.floor(m / 60), d = new Date(SEEN[who]);
  return m < 1 ? 'Active now' : m < 60 ? `Last active ${m} minute${m === 1 ? '' : 's'} ago` : h < 24 ? `Last active ${h} hour${h === 1 ? '' : 's'} ago`
    : Date.now() - d < 7 * 864e5 ? 'Last active ' + d.toLocaleDateString('en-US', { weekday: 'long' }) : 'Last active ' + d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
/** Repaints rings and "last active" text in place (no full redraw), as time passes or after a check-in. */
function paintSeen() {
  document.querySelectorAll('[data-seen]').forEach(el => { el.classList.remove('live', 'idle'); const c = seenCls(el.dataset.seen); if (c) el.classList.add(c); });
  document.querySelectorAll('[data-seen-txt]').forEach(el => { const t = seenTxt(el.dataset.seenTxt); el.textContent = t ? ' · ' + t : ''; });
}
// ----- People pages and @mentions -----
const personOf = name => S.People.find(p => p.name.toLowerCase() === String(name || '').toLowerCase());
// "@Shana" or "@clara's" tags that person. Longer names are tried first; "@Clarabelle" does not match "Clara".
const mentionRe = () => S.People.length ? new RegExp('@(' + S.People.map(p => p.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).sort((a, b) => b.length - a.length).join('|') + ')(?![A-Za-z0-9_])', 'gi') : null;
const mentionsIn = text => { const re = mentionRe(), out = new Set(); if (re) String(text || '').replace(re, (m, n) => { const p = personOf(n); if (p) out.add(p.name); return m; }); return [...out]; };
/** Escapes text and turns @Name into a link to that person's page. */
const withMentions = text => { const h = esc(text), re = mentionRe(); return re ? h.replace(re, (m, n) => { const p = personOf(n); return p ? `<a class="mention" data-a="person" data-v="${esc(p.name)}">@${esc(p.name)}</a>` : m; }) : h; };
const nameLink = who => personOf(who) ? `<b class="plink" data-a="person" data-v="${esc(who)}">${esc(who)}</b>` : `<b>${esc(who)}</b>`;
const taggedMe = (text, who) => who !== ME && mentionsIn(text).includes(ME);
/** Messages and comments that tag someone, newest first. */
const personMentions = name => S.Messages.filter(m => list(m.tags).includes(name) || mentionsIn(m.text).includes(name)).map(m => ({ time: m.time, who: m.from, text: m.text, open: ['Messages', m.id], kind: 'message' }))
  .concat(S.Comments.filter(c => c.system !== '1' && c.table !== 'gifts' && mentionsIn(c.text).includes(name)).map(c => ({ time: c.time, who: c.who, text: c.text, open: [c.table, c.ref], kind: 'comment' })))
  .sort((a, b) => String(b.time || '').localeCompare(String(a.time || ''))).slice(0, 10);
const avatar = who => who === 'App' ? `<span class="av"><i data-p="App">${ic('home', 16)}</i></span>`
  : `<span class="av ${seenCls(who)}" ${ADULTS.includes(who) ? `data-seen="${esc(who)}"` : ''} ${personOf(who) ? `data-a="person" data-v="${esc(who)}"` : ''} style="background:${pcol(who)}"><i style="background:color-mix(in srgb, ${pcol(who)} 22%, var(--card));color:${pcol(who)}">${esc((who || '?').charAt(0))}</i></span>`;
const whoDots = names => names.length ? `<span class="who">${names.map(n => `<i style="--pc:${pcol(n)}" title="${esc(n)}">${esc(n.slice(0, 2))}</i>`).join('')}</span>` : '';
// Recipe ingredients are stored as "name (amount unit)", e.g. "chicken breast (1 lb)", so the Sheet and backend keep working.
const ingParse = s => { s = String(s || '').trim(); const m = s.match(/^(.*?)\s*\(([^()]*)\)\s*$/); const name = m ? m[1].trim() : s, q = m ? m[2].trim() : '';

// ---------- push notifications (Firebase Cloud Messaging) ----------
const FB = self.FIREBASE_CONFIG || {}, FBV = '10.14.1', pushReady = () => !!(FB.apiKey && self.FIREBASE_VAPID_KEY);

let swReg = null;
function loadScript(src) { return new Promise((res, rej) => { const x = document.createElement('script'); x.src = src; x.onload = res; x.onerror = () => rej(new Error("Couldn't load " + src)); document.head.appendChild(x); }); }

const myTokens = () => list(st('pushTokens', ''));

  store.set('pushTok', remove ? '' : tok); store.set('pushOn', remove ? '' : '1');

}

  const on = store.get('pushOn') === '1' && Notification.permission === 'granted';
  if (Notification.permission === 'denied') return '<div class="small muted">Notifications are blocked for this app. Turn them on in iPhone Settings, then Notifications, then Momnie Family.</div>';
  return on ? `<div class="kv grn">On for this phone</div><div class="actions"><button class="btn gray sm" data-a="ntest">${ic('bell', 16)}Send me a test</button><button class="btn danger sm" data-a="pushOff">Turn off on this phone</button></div>`

}
A.pushOn = async (v, el) => { el.disabled = true;
  try { const perm = await Notification.requestPermission(); if (perm !== 'granted') throw new Error('Notifications were not allowed.');
    await saveToken(await fbToken()); toast('Push is on for this phone'); } catch (e) { toast(e.message || 'Could not turn on push'); }
  el.disabled = false; refresh(); };
A.pushOff = async () => { try { if (self.firebase) await firebase.messaging().deleteToken(); } catch (e) {} await saveToken(store.get('pushTok'), true); toast('Push is off for this phone'); refresh(); };

  if (!('serviceWorker' in navigator)) return;
  try { swReg = await navigator.serviceWorker.register('sw.js'); } catch (e) { return; }
  if (pushReady() && store.get('pushOn') === '1' && self.Notification && Notification.permission === 'granted') { try { const t = await fbToken(); if (t !== store.get('pushTok') || !myTokens().includes(t)) await saveToken(t); } catch (e) {} }
}

// ---------- splash screens ----------
function splash(force) {
  const q = S.Updates.filter(u => (u.title || u.message) && !list(u.hiddenFrom).includes(ME)).sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(u => ({ u }));
  const dly = S.Activity.find(a => a.type === 'daily' && a.time.slice(0, 10) === TODAY);
  if (dly && (force || st('splashHidden', '') !== TODAY)) q.push({ a: dly });

    const d = sheet(x.u ? `<div class="small muted b">WHAT'S NEW${x.u.date ? ' · ' + fmtDate(x.u.date) : ''}</div><h2 style="margin-top:6px">${esc(x.u.title)}</h2><div style="text-align:left">${md(x.u.message)}</div>` : `<div class="small muted b">${fmtLong(TODAY).toUpperCase()}</div><div style="margin-top:10px">${dailyHTML(x.a)}</div>`, 'splash');

// ---------- start ----------
function geo(force) {
  if (store.get('geo') !== '1' || !navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => { const lat = +p.coords.latitude.toFixed(3), lon = +p.coords.longitude.toFixed(3); let old = {}; try { old = JSON.parse(store.get('loc') || '{}'); } catch (e) {}
    store.set('loc', JSON.stringify({ lat, lon })); if (force || Math.abs((old.lat || 0) - lat) > 0.05 || Math.abs((old.lon || 0) - lon) > 0.05) call('weather', { lat, lon }); }, () => {}, { maximumAge: 600000, timeout: 8000 });
}
let lastLoad = 0, loading = null;

  if (!loading) loading = api('boot', { lat: loc.lat, lon: loc.lon }).finally(() => { loading = null; }); await loading; lastLoad = Date.now(); refresh(); }

  $('view').innerHTML = `<div class="empty"><div style="margin-bottom:10px">${ic('key', 34)}</div><b>${bad ? 'This link no longer works' : 'Open your personal link'}</b><br><br>Each of us has our own Momnie Family link. Open it in Safari on this phone, then tap Share, then Add to Home Screen.${bad ? '<br><br>Ask Paul for a new link.' : ''}</div>`; }

  if (!PIN) return noKey();

  try { await load(); } catch (e) { if (!PIN) return; if (cached) toast("Couldn't refresh. Showing the last copy."); else $('view').innerHTML = `<div class="empty">${esc(e.message)}<br><br><button class="btn" data-a="reload">Try again</button></div>`; $('sync').classList.remove('on'); return; }
  $('sync').classList.remove('on'); splash(); geo(); pushInit();
}
A.reload = async () => { try { await load(); toast('Up to date'); } catch (e) { toast(e.message); } };
// While the app is open, check in every minute so the other person sees you as active (and you see them).
setInterval(() => { if (document.hidden || !ME || busy || loading) { paintSeen(); return; } api('ping').then(paintSeen, paintSeen); }, 60000);
// Typing "@" in a message or a comment shows people to tag; tapping one fills in the name.
let mentionEl = null;
function mentionSuggest(el) {
  const anchor = el.classList.contains('cin') ? el.closest('.row') || el : el, nx = anchor.nextElementSibling, box0 = nx && nx.classList.contains('msugg') ? nx : null;
  const m = el.value.slice(0, el.selectionStart || 0).match(/(^|\s)@([A-Za-z'-]*)$/), q = m ? m[2].toLowerCase() : null;
  const names = q === null ? [] : S.People.map(p => p.name).filter(n => n.toLowerCase().startsWith(q.replace(/'.*$/, '')));
  if (!names.length) { if (box0) box0.remove(); return; }
  const box = box0 || anchor.insertAdjacentElement('afterend', Object.assign(document.createElement('div'), { className: 'msugg' }));
  box.innerHTML = names.map(n => `<button type="button" class="chip" data-a="mentionPick" data-v="${esc(n)}">@${esc(n)}</button>`).join(''); mentionEl = el;
}
document.addEventListener('input', ev => { const el = ev.target; if (el.matches && el.matches('textarea[data-k="text"], .cin')) mentionSuggest(el); });
A.mentionPick = n => { const el = mentionEl; if (!el) return; const pos = el.selectionStart || el.value.length, pre = el.value.slice(0, pos).replace(/@[A-Za-z'-]*$/, '@' + n + ' ');
  el.value = pre + el.value.slice(pos); el.focus(); el.setSelectionRange(pre.length, pre.length); el.dispatchEvent(new Event('input', { bubbles: true })); };
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (ME && Date.now() - lastLoad > 60000 && !sheets.length) load().catch(() => {}); });
// swipe an upcoming dinner right to change it (Random or Select)
(function () { let x0 = null, y0 = 0, el = null;
  document.addEventListener('touchstart', e => { el = e.target.closest('.dcard[data-swipe]'); if (el) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } }, { passive: true });
  document.addEventListener('touchmove', e => { if (!el || x0 === null) return; const dx = e.touches[0].clientX - x0; if (Math.abs(e.touches[0].clientY - y0) > 30) { el.style.transform = ''; el = null; return; } el.style.transform = `translateX(${Math.max(0, dx) * 0.6}px)`; }, { passive: true });
  document.addEventListener('touchend', e => { if (!el || x0 === null) return; const dx = e.changedTouches[0].clientX - x0, id = el.dataset.menu; el.style.transform = ''; el = null; x0 = null; if (dx > 70) { const stop = ev => { ev.stopPropagation(); ev.preventDefault(); }; document.addEventListener('click', stop, { capture: true, once: true }); setTimeout(() => document.removeEventListener('click', stop, { capture: true }), 400); MCHG = id; render(); } }); })();
// swipe on a recipe in Meals > Recipes: right = pick a night, left = skip for now
(function () { let x0 = null, y0 = 0, el = null, inn = null, moved = false;
  document.addEventListener('touchstart', e => { el = e.target.closest('.rcard[data-rid]'); inn = el && el.querySelector('.rin'); moved = false; if (el) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } }, { passive: true });

    if (!moved || Math.abs(dx) < 80) return;
    const stop = ev => { ev.stopPropagation(); ev.preventDefault(); }; document.addEventListener('click', stop, { capture: true, once: true }); setTimeout(() => document.removeEventListener('click', stop, { capture: true }), 400);

// swipe left on a Feed post to delete it
(function () { let x0 = null, y0 = 0, el = null, post = null, moved = false;

  document.addEventListener('touchmove', e => { if (!el || x0 === null) return; const dx = e.touches[0].clientX - x0;

    if (moved && dx < -80) { const stop = ev => { ev.stopPropagation(); ev.preventDefault(); }; document.addEventListener('click', stop, { capture: true, once: true }); setTimeout(() => document.removeEventListener('click', stop, { capture: true }), 400); A.feedDel(fid); } }); })();

  document.addEventListener('touchend', async () => { if (y0 === null) return; y0 = null; if (d < TRIG) { set(0, true); return; } on = true; ic.textContent = '↻'; el.classList.add('spin'); set(60, true); try { await load(); } catch (e) { toast(e.message); } el.classList.remove('spin'); on = false; set(0, true); }); })();
document.querySelectorAll('nav.bottom button').forEach(b => b.insertAdjacentHTML('afterbegin', ic(b.dataset.ic, 24)));
